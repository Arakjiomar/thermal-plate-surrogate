[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-surrogate"
version = "0.1.0"
description = "Neural field surrogate for steady 2D heat conduction, with uncertainty quantification"
authors = [{ name = "Omar Arakji" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0", "matplotlib>=3.7", "torch>=2.2"]

[project.scripts]
plate-surrogate = "thermal_surrogate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
