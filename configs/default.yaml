# Grid
n: 64                 # nodes per side including boundary (h = 1/63)

# Parameter box for the in-distribution Latin hypercube (low, high)
params:
  k:        [0.5, 5.0]
  amp:      [500.0, 5000.0]  # gives source-only peak rise ~3-94 deg (5th-95th pct), comparable to the 0-100 edge range
  x0:       [0.2, 0.8]
  y0:       [0.2, 0.8]
  sigma:    [0.05, 0.20]
  t_left:   [0.0, 100.0]
  t_right:  [0.0, 100.0]
  t_bottom: [0.0, 100.0]
  t_top:    [0.0, 100.0]

# Dataset sizes. Train/val/test share one Latin hypercube (then a random split);
# the OOD set is sampled separately.
n_train: 800
n_val: 100
n_test: 100
n_ood: 100

# Out-of-distribution set: each range is widened by `ood_expand` x its width on
# both sides, clipped to `physical_limits`, and only samples with at least one
# parameter OUTSIDE the in-distribution box are kept.
ood_expand: 0.25
physical_limits:
  k:     [0.2, null]    # conductivity must stay positive
  amp:   [100.0, null]  # keep it a heat source, not a sink
  x0:    [0.05, 0.95]   # source centre stays on the plate
  y0:    [0.05, 0.95]
  sigma: [0.03, null]   # >= 2 grid spacings (h = 0.016) so the solver resolves the source

seed: 0
