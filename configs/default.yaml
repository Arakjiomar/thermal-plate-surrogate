# Grid
n: 64                 # nodes per side including boundary (h = 1/63)

# Parameter box for the in-distribution Latin hypercube (low, high)
params:
  k:        [0.5, 5.0]
  amp:      [500.0, 5000.0]  # gives source-only peak rise ~3-94 deg (5th-95th pct), comparable to the 0-100 edge range
  x0:       [0.2, 0.8]
  y0:       [0.2, 0.8]
  sigma:    [0.05, 0.20]
  t_left:   [0.0, 100.0]
  t_right:  [0.0, 100.0]
  t_bottom: [0.0, 100.0]
  t_top:    [0.0, 100.0]

# Dataset sizes (milestone 3)
n_train: 800
n_val: 100
n_test: 100
n_ood: 100

seed: 0
